<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Complaints - HyperGov</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .admin-container { max-width: 1400px; margin: 2rem auto; padding: 0 1rem; }
    .page-header { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color: white; padding: 3rem 1rem; text-align: center; }
    .complaints-table { width: 100%; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .complaints-table table { width: 100%; border-collapse: collapse; }
    .complaints-table th { background: #3498db; color: white; padding: 1rem; text-align: left; }
    .complaints-table td { padding: 1rem; border-bottom: 1px solid #ecf0f1; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo">🏛️ HyperGov Admin</a>
      <ul class="nav-links">
        <li><a href="/admin-dashboard.html">Dashboard</a></li>
        <li><a href="/admin-projects.html">Projects</a></li>
        <li><a href="/admin-complaints.html" class="active">Complaints</a></li>
      </ul>
    </nav>
  </header>

  <div class="page-header">
    <h1>📋 Complaints Management</h1>
    <p>Monitor and manage citizen complaints</p>
  </div>

  <div class="admin-container">
    <div class="complaints-table">
      <table>
        <thead>
          <tr>
            <th>Citizen</th>
            <th>Issue Type</th>
            <th>Location</th>
            <th>Ward</th>
            <th>Description</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="complaintsTable">
          <tr><td colspan="6" style="text-align: center;">Loading complaints...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadComplaints() {
      try {
        const response = await fetch('/api/issues');
        const result = await response.json();
        const table = document.getElementById('complaintsTable');
        
        if (result.success && result.data.length > 0) {
          table.innerHTML = result.data.map(c => `
            <tr>
              <td>${c.citizenName}</td>
              <td>${c.issueType}</td>
              <td>${c.location}</td>
              <td>${c.ward}</td>
              <td>${c.description}</td>
              <td>${new Date(c.createdAt).toLocaleDateString()}</td>
            </tr>
          `).join('');
        } else {
          table.innerHTML = '<tr><td colspan="6" style="text-align: center;">No complaints found</td></tr>';
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }

    loadComplaints();
  </script>
</body>
</html>
