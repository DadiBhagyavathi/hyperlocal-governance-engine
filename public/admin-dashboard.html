<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - HyperGov</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .admin-container { max-width: 1400px; margin: 2rem auto; padding: 0 1rem; }
    .page-header { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color: white; padding: 3rem 1rem; text-align: center; }
    .admin-nav { display: flex; gap: 1rem; margin-bottom: 2rem; }
    .admin-nav a { padding: 1rem 2rem; background: white; border-radius: 8px; text-decoration: none; color: #2c3e50; font-weight: bold; }
    .admin-nav a.active { background: #3498db; color: white; }
    .section { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 2rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 5px; }
    .btn { padding: 0.75rem 1.5rem; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #2980b9; }
    .alert-box { padding: 1rem; margin-bottom: 1rem; border-radius: 5px; border-left: 4px solid #e74c3c; background: #fff5f5; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo">🏛️ HyperGov Admin</a>
      <ul class="nav-links">
        <li><a href="/admin-dashboard.html" class="active">Dashboard</a></li>
        <li><a href="/admin-projects.html">Projects</a></li>
        <li><a href="/admin-complaints.html">Complaints</a></li>
      </ul>
    </nav>
  </header>

  <div class="page-header">
    <h1>🔐 Admin Dashboard</h1>
    <p>Manage civic governance platform</p>
  </div>

  <div class="admin-container">
    <div class="section">
      <h2>🚨 AI Issue Clusters</h2>
      <div id="alertsContainer">Loading alerts...</div>
    </div>

    <div class="section">
      <h2>➕ Add New Project</h2>
      <form id="projectForm">
        <div class="form-group">
          <label>Project Name</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" name="location" required>
        </div>
        <div class="form-group">
          <label>Ward</label>
          <input type="text" name="ward" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select name="category" required>
            <option value="Infrastructure">Infrastructure</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Education">Education</option>
            <option value="Environment">Environment</option>
          </select>
        </div>
        <div class="form-group">
          <label>Before Image URL</label>
          <input type="url" name="beforeImage" required>
        </div>
        <div class="form-group">
          <label>After Image URL</label>
          <input type="url" name="afterImage" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label>Budget (₹)</label>
          <input type="number" name="budget" required>
        </div>
        <div class="form-group">
          <label>Completion Date</label>
          <input type="date" name="completionDate" required>
        </div>
        <button type="submit" class="btn">Add Project</button>
      </form>
    </div>
  </div>

  <script>
    async function loadAlerts() {
      try {
        const response = await fetch('/api/issues/detected');
        const result = await response.json();
        const container = document.getElementById('alertsContainer');
        
        if (result.success && result.data.length > 0) {
          container.innerHTML = result.data.map(alert => `
            <div class="alert-box">
              <strong>${alert.alert}</strong><br>
              📍 Location: ${alert.location}<br>
              ⚠️ Issue: ${alert.issue}<br>
              📊 Complaints: ${alert.complaints}<br>
              🔴 Severity: ${alert.severity}
            </div>
          `).join('');
        } else {
          container.innerHTML = '<div style="color: #27ae60; text-align: center;">✅ No high-priority clusters detected</div>';
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }

    document.getElementById('projectForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);
      
      try {
        const response = await fetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        
        if (result.success) {
          alert('✅ Project added successfully!');
          e.target.reset();
        } else {
          alert('❌ Error: ' + result.message);
        }
      } catch (error) {
        alert('❌ Error adding project');
      }
    });

    loadAlerts();
  </script>
</body>
</html>
